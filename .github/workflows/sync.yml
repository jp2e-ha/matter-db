name: sync

on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC daily
  workflow_dispatch:

# Never let two scheduled syncs overlap; if a manual run lands during a
# scheduled run, queue rather than cancel — losing work mid-walk would
# leave the DB inconsistent.
concurrency:
  group: matter-db-sync
  cancel-in-progress: false

permissions:
  contents: write   # commit data/matter.db and CHANGES.md back to the repo
  issues: write     # open an issue if a sync fails

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Editable installs via uv 0.9 sometimes write a .pth file with no
      # trailing newline that Python silently ignores. Forcing src on the
      # path makes the package importable regardless.
      PYTHONPATH: src
    steps:
      - name: Checkout (full history, so commit-back has a base)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install project
        run: uv sync

      - name: Pre-sync DB state
        run: |
          if [ -f data/matter.db ]; then
            echo "matter.db present — restoring from previous commit"
            ls -la data/matter.db
            uv run python -m matter_db.cli status || true
          else
            echo "matter.db not in repo — first run; sync will create from empty"
          fi

      - name: Run sync
        run: uv run python -m matter_db.cli sync

      - name: Generate CHANGES.md and changes-latest.json
        run: |
          uv run python -m matter_db.cli diff --since-last \
            --format markdown --output CHANGES.md
          uv run python -m matter_db.cli diff --since-last \
            --format json --output changes-latest.json

      - name: Compute commit headline
        id: msg
        run: |
          HEADLINE=$(uv run python -m matter_db.cli diff --since-last --format headline)
          echo "headline=${HEADLINE}" >> "$GITHUB_OUTPUT"
          echo "::notice::${HEADLINE}"

      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/matter.db CHANGES.md changes-latest.json
          if git diff --cached --quiet; then
            echo "nothing to commit (DB and reports unchanged)"
          else
            git commit -m "${{ steps.msg.outputs.headline }}"
            git push
          fi

      - name: Open issue on sync failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let log = '(no log file found)';
            try {
              log = fs.readFileSync('data/sync.log', 'utf8').slice(-3000);
            } catch (e) {}
            const date = new Date().toISOString().slice(0, 10);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `sync failed on ${date}`,
              labels: ['sync-failure'],
              body: `Workflow run: ${url}\n\n<details><summary>Last 3 KB of sync.log</summary>\n\n\`\`\`\n${log}\n\`\`\`\n\n</details>`,
            });
