name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/matter.db'
      - 'web/**'
      - 'src/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'fly.toml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'changes-latest.json'
  workflow_dispatch:

# Don't let two deploys race; if a sync-triggered deploy is in flight
# when a manual deploy is requested, the manual one queues.
concurrency:
  group: matter-db-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
