# Generated for the matter-db public web app.
# Single Docker image (Dockerfile at the repo root) running uvicorn
# against web.app:app, which serves the landing page at / and mounts
# Datasette at /db/.

app = 'matter-db'
primary_region = 'iad'  # closest to Charleston, SC

[build]
  # Uses ./Dockerfile

[http_service]
  internal_port = 8080
  force_https = true
  # Auto-stop when idle, auto-start on incoming request. First request
  # after idle pays a 1-3s cold-start; subsequent requests are warm.
  # min_machines_running = 0 keeps us in the free tier.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    grace_period = '10s'
    interval = '30s'
    method = 'GET'
    timeout = '5s'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
